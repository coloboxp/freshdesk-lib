[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freshdesk-lib"
version = "0.1.0"
description = "A world-class modern Python library for Freshdesk API v2"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy"
]

[tool.hatch.build.targets.wheel]
packages = ["freshdesk"]

[tool.pytest.ini_options]
addopts = "--cov=freshdesk --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require real Freshdesk credentials",
]

[tool.coverage.run]
branch = true
source = ["freshdesk"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
